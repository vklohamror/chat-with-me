<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1422">
<title>Chat With Me</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;background:#0b1422;
 color:#fff;min-height:100vh
}
header{
 background:#12243a;padding:16px;text-align:center;
 border-bottom:1px solid #263b55
}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;color:#a9bfd5;font-size:13px}
.container{max-width:600px;margin:auto;padding:15px}
.card{
 background:#17263a;border:1px solid #2b4058;border-radius:14px;
 padding:16px;margin-bottom:15px
}
h2{margin:0 0 15px;font-size:20px}
h3{margin:0 0 12px;font-size:17px}
input,button{
 width:100%;padding:13px;border-radius:10px;
 font-size:16px;margin:6px 0
}
input{
 background:#0c1929;color:white;border:1px solid #344b63;
 outline:none
}
button{
 border:none;background:#1684e8;color:white;font-weight:bold;
 cursor:pointer
}
button.secondary{background:#344b63}
button.danger{background:#b83232}
button:disabled{opacity:.6}
.status{font-size:14px;color:#ffc96b;min-height:20px;margin:5px 0}
.small{font-size:13px;color:#a9bfd5}
.hidden{display:none!important}
.user-item,.chat-item{
 display:flex;align-items:center;gap:12px;
 background:#102035;padding:12px;border-radius:12px;
 margin:8px 0;border:1px solid #263e58
}
.avatar{
 width:44px;height:44px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 background:#1676cf;font-size:18px;font-weight:bold;flex-shrink:0
}
.user-info{flex:1;min-width:0}
.user-info strong{display:block;overflow:hidden;text-overflow:ellipsis}
.user-info small{color:#9eb4ca}
.user-item button,.chat-item button{
 width:auto;margin:0;padding:10px 14px
}
#messages{
 height:55vh;min-height:300px;max-height:600px;
 overflow-y:auto;background:#091523;border-radius:12px;
 padding:12px;margin:10px 0
}
.message{
 max-width:85%;padding:10px 12px;border-radius:12px;
 margin:8px 0;word-break:break-word;white-space:pre-wrap
}
.message.mine{background:#1267a8;margin-left:auto}
.message.other{background:#26394f;margin-right:auto}
.message small{
 display:block;font-size:10px;color:#c3d5e7;margin-top:5px
}
.chat-input-row{display:flex;gap:8px;align-items:center}
.chat-input-row input{flex:1;margin:0}
.chat-input-row button{width:90px;margin:0}
#chatTitle{font-size:18px;margin:0}
.top-row{display:flex;align-items:center;gap:10px}
.top-row button{width:auto;margin:0;padding:10px 14px}
.empty{text-align:center;color:#91a8bf;padding:20px}
.footer{text-align:center;color:#71879e;font-size:12px;padding:20px}
</style>
</head>

<body>

<header>
<h1>💬 Chat With Me</h1>
<p>Connect • Chat • Share</p>
</header>

<div class="container">

<!-- LOGIN / SIGNUP -->
<div id="authBox" class="card">
<h2 id="authTitle">Login करें</h2>

<input id="nameField" placeholder="आपका नाम" class="hidden">
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">

<button id="authButton" onclick="login()">Login</button>
<button class="secondary" onclick="toggleAuth()" id="toggleButton">
नया अकाउंट बनाएँ
</button>

<div id="authStatus" class="status"></div>
<p class="small">
नया अकाउंट बनाने के लिए अपना नाम, Email और Password भरें।
</p>
</div>

<!-- HOME -->
<div id="homeBox" class="hidden">

<div class="card">
<h2 id="welcome">नमस्ते!</h2>
<button class="danger" onclick="logout()">Logout</button>
<div id="homeStatus" class="status"></div>
</div>

<div class="card">
<h3>💬 मेरी Chats</h3>
<div id="chatList">
<div class="empty">Chats लोड हो रही हैं...</div>
</div>
</div>

<div class="card">
<h3>🔎 लोगों को खोजें</h3>
<input id="search" placeholder="नाम या Email खोजें..." oninput="filterUsers()">
<div id="usersList">
<div class="empty">Users लोड हो रहे हैं...</div>
</div>
</div>

</div>

<!-- CHAT -->
<div id="chatBox" class="hidden">

<div class="card">
<div class="top-row">
<button class="secondary" onclick="backToUsers()">← वापस</button>
<div>
<h2 id="chatTitle">Chat</h2>
<div class="small">Private conversation</div>
</div>
</div>

<div id="chatStatus" class="status"></div>

<div id="messages">
<div class="empty">Messages लोड हो रहे हैं...</div>
</div>

<div class="chat-input-row">
<input id="messageInput" placeholder="मैसेज लिखें..."
onkeydown="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">Send</button>
</div>
</div>

</div>

<div class="footer">Chat With Me • Connect with people</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ==============================
   SUPABASE CONFIG
============================== */

const SUPABASE_URL =
"https://drvrqgfsakuhzbzklafx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3wHhdUS0kDgI6OuPTmfiUA_XdPWrR3H";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

/* ==============================
   APP STATE
============================== */

let currentUser = null;
let allUsers = [];
let currentChatUser = null;
let currentConversationId = null;
let realtimeChannel = null;
let renderedMessageIds = new Set();
let isSignup = false;
let loadingSession = false;

/* ==============================
   HELPERS
============================== */

function status(id,text){
 const el=document.getElementById(id);
 if(el)el.textContent=text||"";
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[c];
 });
}

function displayName(user){
 return user.name ||
        user.full_name ||
        user.username ||
        user.email ||
        "User";
}

function getInitial(name){
 return (name||"U").trim().charAt(0).toUpperCase()||"U";
}

function showHome(){
 document.getElementById("authBox").classList.add("hidden");
 document.getElementById("chatBox").classList.add("hidden");
 document.getElementById("homeBox").classList.remove("hidden");
}

function showAuth(){
 document.getElementById("authBox").classList.remove("hidden");
 document.getElementById("homeBox").classList.add("hidden");
 document.getElementById("chatBox").classList.add("hidden");
}

/* ==============================
   LOGIN / SIGNUP
============================== */

function toggleAuth(){
 isSignup=!isSignup;

 document.getElementById("authTitle").textContent=
  isSignup?"नया अकाउंट बनाएँ":"Login करें";

 document.getElementById("authButton").textContent=
  isSignup?"Signup":"Login";

 document.getElementById("toggleButton").textContent=
  isSignup?"पहले से अकाउंट है? Login":"नया अकाउंट बनाएँ";

 document.getElementById("nameField").classList.toggle("hidden",!isSignup);

 status("authStatus","");
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const name=document.getElementById("nameField").value.trim();

 if(!email||!password){
  status("authStatus","Email और Password भरें।");
  return;
 }

 if(isSignup&&!name){
  status("authStatus","अपना नाम भरें।");
  return;
 }

 const btn=document.getElementById("authButton");
 btn.disabled=true;
 status("authStatus",isSignup?"Account बनाया जा रहा है...":"Login हो रहा है...");

 try{
  let result;

  if(isSignup){
   result=await db.auth.signUp({
    email:email,
    password:password,
    options:{
     data:{name:name,full_name:name},
     emailRedirectTo:"https://vklohamror.github.io/chat-with-me/"
    }
   });
  }else{
   result=await db.auth.signInWithPassword({
    email:email,
    password:password
   });
  }

  if(result.error)throw result.error;

  if(isSignup&&!result.data.session){
   status("authStatus","Account बन गया। अब Login करें।");
   isSignup=false;
   toggleAuth();
   return;
  }

  currentUser=result.data.user;
  await afterLogin();

 }catch(error){
  status("authStatus","Error: "+(error.message||error));
 }finally{
  btn.disabled=false;
 }
}

async function logout(){
 try{
  if(realtimeChannel){
   await db.removeChannel(realtimeChannel);
   realtimeChannel=null;
  }

  await db.auth.signOut();
  currentUser=null;
  currentChatUser=null;
  currentConversationId=null;
  showAuth();
  status("authStatus","Logout हो गया।");
 }catch(error){
  status("homeStatus",error.message);
 }
}

/* ==============================
   SESSION
============================== */

async function checkSession(){
 if(loadingSession)return;
 loadingSession=true;

 try{
  const {data,error}=await db.auth.getSession();
  if(error)throw error;

  if(data.session){
   currentUser=data.session.user;
   await afterLogin();
  }else{
   showAuth();
  }
 }catch(error){
  showAuth();
  status("authStatus",error.message);
 }finally{
  loadingSession=false;
 }
}

async function afterLogin(){
 if(!currentUser)return;

 showHome();

 const name=
  currentUser.user_metadata?.name||
  currentUser.user_metadata?.full_name||
  currentUser.email;

 document.getElementById("welcome").textContent=
  "नमस्ते, "+name+" 👋";

 status("homeStatus","");

 await Promise.allSettled([
  loadUsers(),
  loadMyChats()
 ]);
}

/* ==============================
   PROFILE / USERS
============================== */

async function loadUsers(){
 const box=document.getElementById("usersList");
 box.innerHTML='<div class="empty">Users लोड हो रहे हैं...</div>';

 try{
  const {data,error}=await db
   .from("profiles")
   .select("*")
   .order("created_at",{ascending:false});

  if(error)throw error;

  allUsers=(data||[])
   .filter(u=>u.id!==currentUser.id)
   .map(u=>({
    id:u.id,
    name:u.name||u.full_name||u.username||u.email||"User",
    email:u.email||""
   }));

  filterUsers();

 }catch(error){
  box.innerHTML='<div class="empty">Users लोड नहीं हुए। '+escapeHTML(error.message)+'</div>';
 }
}

function filterUsers(){
 const q=(document.getElementById("search").value||"")
  .toLowerCase().trim();

 const list=allUsers.filter(u=>
  displayName(u).toLowerCase().includes(q)||
  (u.email||"").toLowerCase().includes(q)
 );

 const box=document.getElementById("usersList");

 if(!list.length){
  box.innerHTML='<div class="empty">कोई User नहीं मिला।</div>';
  return;
 }

 box.innerHTML=list.map(u=>`
  <div class="user-item">
   <div class="avatar">${escapeHTML(getInitial(displayName(u)))}</div>
   <div class="user-info">
    <strong>${escapeHTML(displayName(u))}</strong>
    <small>${escapeHTML(u.email||"")}</small>
   </div>
   <button onclick="startChat('${u.id}')">Chat</button>
  </div>
 `).join("");
}

/* ==============================
   FIND EXISTING CONVERSATIONS
============================== */

async function getMyConversationIds(){
 const {data,error}=await db
  .from("conversation_members")
  .select("conversation_id")
  .eq("user_id",currentUser.id);

 if(error)throw error;

 return [...new Set((data||[]).map(x=>x.conversation_id))];
}

async function findExistingConversation(otherUserId){
 const myIds=await getMyConversationIds();

 if(!myIds.length)return null;

 const {data:members,error:memberError}=await db
  .from("conversation_members")
  .select("conversation_id,user_id")
  .in("conversation_id",myIds);

 if(memberError)throw memberError;

 const memberMap={};

 (members||[]).forEach(m=>{
  if(!memberMap[m.conversation_id]){
   memberMap[m.conversation_id]=[];
  }
  memberMap[m.conversation_id].push(m.user_id);
 });

 const matchingIds=myIds.filter(id=>{
  const arr=memberMap[id]||[];
  return arr.includes(currentUser.id)&&arr.includes(otherUserId);
 });

 if(!matchingIds.length)return null;

 const {data:conversations,error}=await db
  .from("conversations")
  .select("id,is_group")
  .in("id",matchingIds);

 if(error)throw error;

 const direct=(conversations||[]).find(c=>!c.is_group);

 return direct?direct.id:null;
}

/* ==============================
   MY CHATS LIST
============================== */

async function loadMyChats(){
 const box=document.getElementById("chatList");
 box.innerHTML='<div class="empty">Chats लोड हो रही हैं...</div>';

 try{
  const myIds=await getMyConversationIds();

  if(!myIds.length){
   box.innerHTML='<div class="empty">अभी कोई Chat नहीं है। किसी User से Chat शुरू करें।</div>';
   return;
  }

  const {data:conversations,error:convError}=await db
   .from("conversations")
   .select("id,is_group,created_at")
   .in("id",myIds);

  if(convError)throw convError;

  const directChats=(conversations||[]).filter(c=>!c.is_group);

  if(!directChats.length){
   box.innerHTML='<div class="empty">अभी कोई Direct Chat नहीं है।</div>';
   return;
  }

  const chatIds=directChats.map(c=>c.id);

  const {data:members,error:memberError}=await db
   .from("conversation_members")
   .select("conversation_id,user_id")
   .in("conversation_id",chatIds);

  if(memberError)throw memberError;

  const otherIds=[...new Set(
   (members||[])
    .filter(m=>m.user_id!==currentUser.id)
    .map(m=>m.user_id)
  )];

  if(!otherIds.length){
   box.innerHTML='<div class="empty">Chat सदस्य उपलब्ध नहीं हैं।</div>';
   return;
  }

  const {data:profiles,error:profileError}=await db
   .from("profiles")
   .select("*")
   .in("id",otherIds);

  if(profileError)throw profileError;

  const profileMap={};
  (profiles||[]).forEach(p=>{
   profileMap[p.id]=p;
  });

  const uniqueChats=[];

  directChats.forEach(c=>{
   const userIds=(members||[])
    .filter(m=>m.conversation_id===c.id)
    .map(m=>m.user_id);

   const otherId=userIds.find(id=>id!==currentUser.id);
   if(!otherId)return;

   // किसी एक व्यक्ति के डुप्लिकेट Chat में
   // सबसे पुरानी Chat को लिस्ट में रखें।
   if(uniqueChats.some(x=>x.otherId===otherId))return;

   const profile=profileMap[otherId];
   if(!profile)return;

   uniqueChats.push({
    conversationId:c.id,
    otherId:otherId,
    name:profile.name||profile.full_name||profile.username||profile.email||"User",
    email:profile.email||""
   });
  });

  if(!uniqueChats.length){
   box.innerHTML='<div class="empty">Chat सूची खाली है।</div>';
   return;
  }

  box.innerHTML=uniqueChats.map(c=>`
   <div class="chat-item">
    <div class="avatar">${escapeHTML(getInitial(c.name))}</div>
    <div class="user-info">
     <strong>${escapeHTML(c.name)}</strong>
     <small>${escapeHTML(c.email)}</small>
    </div>
    <button onclick="openChatById('${c.otherId}','${c.conversationId}')">Open</button>
   </div>
  `).join("");

 }catch(error){
  box.innerHTML='<div class="empty">Chats लोड नहीं हुईं: '+escapeHTML(error.message)+'</div>';
 }
}

/* ==============================
   OPEN / CREATE CHAT
============================== */

async function startChat(otherUserId){
 const user=allUsers.find(u=>u.id===otherUserId);

 if(!user){
  status("homeStatus","User नहीं मिला।");
  return;
 }

 status("homeStatus","Chat खोली जा रही है...");

 try{
  // पहले पुरानी Chat खोजें
  let conversationId=
   await findExistingConversation(otherUserId);

  // पुरानी Chat नहीं मिली तो नई बनाएं
  if(!conversationId){
   const {data:conv,error:convError}=await db
    .from("conversations")
    .insert({
     created_by:currentUser.id,
     is_group:false
    })
    .select("id")
    .single();

   if(convError)throw convError;

   conversationId=conv.id;

   const {error:memberError}=await db
    .from("conversation_members")
    .insert([
     {conversation_id:conversationId,user_id:currentUser.id},
     {conversation_id:conversationId,user_id:otherUserId}
    ]);

   if(memberError){
    status("homeStatus","Members जोड़ने में Error: "+memberError.message);
    return;
   }
  }

  await openChatById(otherUserId,conversationId);

  await loadMyChats();

 }catch(error){
  status("homeStatus","Chat Error: "+error.message);
 }
}

async function openChatById(otherUserId,conversationId){
 const user=allUsers.find(u=>u.id===otherUserId);

 let chatUser=user;

 if(!chatUser){
  try{
   const {data,error}=await db
    .from("profiles")
    .select("*")
    .eq("id",otherUserId)
    .single();

   if(error)throw error;

   chatUser={
    id:data.id,
    name:data.name||data.full_name||data.username||data.email||"User",
    email:data.email||""
   };
  }catch(error){
   status("homeStatus","User जानकारी नहीं मिली: "+error.message);
   return;
  }
 }

 currentChatUser=chatUser;
 currentConversationId=conversationId;
 renderedMessageIds=new Set();

 document.getElementById("chatTitle").textContent=
  displayName(chatUser);

 document.getElementById("homeBox").classList.add("hidden");
 document.getElementById("chatBox").classList.remove("hidden");

 document.getElementById("messages").innerHTML=
  '<div class="empty">Messages लोड हो रहे हैं...</div>';

 status("chatStatus","");

 await loadMessages();
 listenMessages();
}

/* ==============================
   LOAD MESSAGES
============================== */

async function loadMessages(){
 if(!currentConversationId)return;

 const box=document.getElementById("messages");
 box.innerHTML="";

 try{
  const {data,error}=await db
   .from("messages")
   .select("*")
   .eq("conversation_id",currentConversationId)
   .order("created_at",{ascending:true});

  if(error)throw error;

  (data||[]).forEach(m=>renderMessage(m));

  if(!data||!data.length){
   box.innerHTML='<div class="empty">पहला मैसेज भेजें 👋</div>';
  }

 }catch(error){
  box.innerHTML='<div class="empty">Messages Error: '+escapeHTML(error.message)+'</div>';
 }
}

function renderMessage(m){
 if(m.id&&renderedMessageIds.has(m.id))return;

 if(m.id)renderedMessageIds.add(m.id);

 const box=document.getElementById("messages");

 const empty=box.querySelector(".empty");
 if(empty)empty.remove();

 const mine=m.sender_id===currentUser.id;

 const div=document.createElement("div");
 div.className="message "+(mine?"mine":"other");

 const content=m.content||m.message||"";

 const time=m.created_at
  ?new Date(m.created_at).toLocaleString("hi-IN",{
    hour:"2-digit",minute:"2-digit"
   })
  :"";

 div.innerHTML=
  escapeHTML(content)+
  "<small>"+(mine?"आप":"")+ " "+escapeHTML(time)+"</small>";

 box.appendChild(div);
 box.scrollTop=box.scrollHeight;
}

/* ==============================
   REALTIME
============================== */

function listenMessages(){
 if(realtimeChannel){
  db.removeChannel(realtimeChannel);
  realtimeChannel=null;
 }

 realtimeChannel=db
  .channel("chat-"+currentConversationId)
  .on(
   "postgres_changes",
   {
    event:"INSERT",
    schema:"public",
    table:"messages",
    filter:"conversation_id=eq."+currentConversationId
   },
   payload=>{
    renderMessage(payload.new);
   }
  )
  .subscribe(statusValue=>{
   if(statusValue==="SUBSCRIBED"){
    status("chatStatus","Realtime connected ✓");
   }
  });
}

/* ==============================
   SEND MESSAGE
============================== */

async function sendMessage(){
 const input=document.getElementById("messageInput");
 const text=input.value.trim();

 if(!text)return;
 if(!currentConversationId||!currentUser)return;

 const sendButton=document.querySelector(".chat-input-row button");
 sendButton.disabled=true;

 try{
  const {data,error}=await db
   .from("messages")
   .insert({
    conversation_id:currentConversationId,
    sender_id:currentUser.id,
    content:text,
    message_type:"text"
   })
   .select()
   .single();

  if(error)throw error;

  input.value="";
  renderMessage(data);

 }catch(error){
  status("chatStatus","मैसेज भेजने में Error: "+error.message);
 }finally{
  sendButton.disabled=false;
  input.focus();
 }
}

/* ==============================
   BACK
============================== */

async function backToUsers(){
 if(realtimeChannel){
  await db.removeChannel(realtimeChannel);
  realtimeChannel=null;
 }

 currentChatUser=null;
 currentConversationId=null;
 renderedMessageIds=new Set();

 document.getElementById("chatBox").classList.add("hidden");
 document.getElementById("homeBox").classList.remove("hidden");

 status("homeStatus","");
 await loadMyChats();
}

/* ==============================
   START APP
============================== */

db.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT"){
  currentUser=null;
  showAuth();
 }
});

checkSession();

</script>
</body>
</html>
